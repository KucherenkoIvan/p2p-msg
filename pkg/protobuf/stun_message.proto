syntax = "proto3";

option go_package = "p2p-msg/pkg/protobuf/gen/stun";

enum MsgClass {
  REQUEST = 0; // 0b00
  SUCCESS_RESPONSE = 1; // 0b01
  FAILURE_RESPONSE = 2; // 0b10
  INDICATION = 3; //0b11
}

enum MsgMethod {
  UNKNOWN = 0;
  BINDING = 1;
  DISCOVER = 2;
  ECHO = 3;
}

message StunMessage {
  MsgClass message_class = 1;
  MsgMethod message_method = 2;
  bytes content = 3;
}

message DiscoverRequest {
  string name = 1;
  optional bytes key = 2;
}

message DiscoverResponse {
  string address = 1;
}

message BindingRequest {
  string peer_name = 1;
}

message BindingResponse {
  string address = 1;
  string name = 2;
  optional bytes key = 3;
}

message EchoRequest {
  string message = 1;
}

message EchoResponse {
  string message = 1;
}
